name: Build and Publish APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.11.1
        run: |
          wget https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -d /opt/gradle gradle-8.11.1-bin.zip
          echo "/opt/gradle/gradle-8.11.1/bin" >> $GITHUB_PATH

      - name: Create Dummy .env
        run: echo "GEMINI_API_KEY=dummy_key" > .env

      - name: Build APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare Distribution
        run: |
          mkdir -p apk-distribution
          cp app/build/outputs/apk/debug/*.apk apk-distribution/app-debug.apk
          sha256sum apk-distribution/app-debug.apk > apk-distribution/app-debug.apk.sha256

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            apk-distribution/app-debug.apk \
            apk-distribution/app-debug.apk.sha256 \
            --title "Debug APK Build $TAG" \
            --notes "Automatically built and published debug APK."
